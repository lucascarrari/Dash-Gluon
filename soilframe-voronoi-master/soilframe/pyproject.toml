[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilframe"
version = "0.1.0"
description = "Framework para pipelines e modelos de dados de solo e clima"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
full = ["geopandas>=1.0.0", "xarray>=2024.1", "netCDF4>=1.6", "streamlit>=1.35"]
mlflow = ["mlflow>=2.10"]
s3 = ["s3fs>=2024.1"]
automl = ["autogluon.tabular[all]>=1.5,<2.0", "autogluon.timeseries>=1.5,<2.0"]

[tool.setuptools.packages.find]
include = ["soilframe*", "soil_analysis*"]
