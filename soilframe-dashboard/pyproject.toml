[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilframe-dashboard"
version = "0.1.0"
description = "Dashboard experimental para explorar dados AquaCrop e operar o SoilFrame"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "plotly>=5.24",
    "pydeck>=0.9",
    "pyarrow>=15.0",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "scipy>=1.12",
    "shapely>=2.0",
    "streamlit>=1.37",
    "soilframe @ git+https://github.com/lucascarrari/SoilFrame-Voronoi.git@10cd1570b4d5d031a47aa632bfdaec61b6235330",
]

[project.optional-dependencies]
automl-tabular = [
    "autogluon.tabular[lightgbm]>=1.5,<2.0",
]
automl-timeseries = [
    "autogluon.timeseries>=1.5,<2.0",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["soilframe_dashboard*"]
