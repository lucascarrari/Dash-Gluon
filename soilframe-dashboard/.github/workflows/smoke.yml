name: Dashboard smoke

on:
  push:
  pull_request:

jobs:
  streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dashboard test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run dashboard smoke test with synthetic Gold data
        run: pytest -q tests/test_dashboard_smoke.py
